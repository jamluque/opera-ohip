[project]
name = "opera-ohip-streaming-aws"
version = "0.1.0"
description = "OPERA Cloud OHIP Streaming API to AWS SQS, S3 and Aurora PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "botocore>=1.34.0",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "tenacity>=8.3.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "awscli>=1.33.0",
  "moto[s3,sqs,secretsmanager]>=5.0.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
ohip-listener = "ohip_bridge.listener:main"
ohip-consumer = "ohip_bridge.consumer:main"
ohip-event-enricher = "ohip_bridge.event_enricher:main"
ohip-analytics-snapshot = "ohip_bridge.analytics_snapshot:main"
ohip-health = "ohip_bridge.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohip_bridge"]

[tool.hatch.build.targets.sdist]
include = [
  "/config",
  "/db",
  "/docs",
  "/examples",
  "/scripts",
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
